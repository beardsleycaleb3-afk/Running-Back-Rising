<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Running Back Rising — Layer 5 Test</title>
<style>
  :root {
    --frame-border: 6px;
    --bottom-border: 80px;
    --btn-size: 50px;
    --frame-color: #c9a227;
  }
  html, body { margin:0; background:#000; overflow:hidden; touch-action:none; height:100%; }

  /* Outer decorative frame around the whole screen */
  #screenFrame {
    position:relative;
    width:100dvw; height:100dvh;
    max-width:420px; margin:0 auto;
    border: var(--frame-border) solid var(--frame-color);
    box-sizing:border-box;
    background:#000;
    overflow:hidden;
  }

  /* Play area sits above the bottom control border */
  #playArea {
    position:absolute; top:0; left:0; right:0;
    bottom: var(--bottom-border);
    overflow:hidden;
  }
  canvas#gameCanvas { display:block; width:100%; height:100%; background:#000; touch-action:none; }

  #hud { position:absolute; top:8px; left:8px; right:8px; color:#fff;
         font-family:monospace; font-size:13px; text-shadow:0 0 3px #000;
         display:flex; justify-content:space-between; pointer-events:none; }
  #log { position:absolute; bottom:8px; left:8px; right:8px; color:#eee;
         font-family:monospace; font-size:11px; background:rgba(0,0,0,.4);
         padding:4px; max-height:60px; overflow:hidden; pointer-events:none; }

  /* Fixed bottom control border — buttons live here, never overlap the field */
  #bottomBorder {
    position:absolute; left:0; right:0; bottom:0; height: var(--bottom-border);
    background: linear-gradient(180deg, #1a1a1a, #000);
    border-top: 3px solid var(--frame-color);
    display:flex; align-items:center; justify-content:center; gap:8px;
    box-sizing:border-box; padding: 0 6px;
  }
  .ability-btn {
    width: var(--btn-size); height: var(--btn-size); border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #3a3a3a, #111);
    border: 2px solid #666; color:#fff; font-family:monospace; font-size:10px;
    display:flex; align-items:center; justify-content:center;
    touch-action:none; position:relative; flex-shrink:0;
  }
  .ability-btn.on-cooldown { opacity:0.4; border-color:#333; }
  .ability-btn img { width:60%; height:60%; object-fit:contain; pointer-events:none; }
  .ability-btn .cd-num { position:absolute; bottom:-14px; font-size:9px; color:#e8a33d; }
</style>
</head>
<body>
  <div id="screenFrame">
    <div id="playArea">
      <canvas id="gameCanvas"></canvas>
      <div id="hud">
        <span id="clockDisplay">Q1 1:30</span>
        <span id="stateDisplay">PLAYING</span>
      </div>
      <div id="log"></div>
    </div>
    <div id="bottomBorder">
      <button class="ability-btn" data-ability="GHOST_MODE"><img src="assets/ui/icons/ability_ghost.svg" alt="Ghost"></button>
      <button class="ability-btn" data-ability="TANK_MODE"><img src="assets/ui/icons/ability_tank.svg" alt="Tank"></button>
      <button class="ability-btn" data-ability="TURBO_MODE"><img src="assets/ui/icons/ability_turbo.svg" alt="Turbo"></button>
      <button class="ability-btn" data-ability="POWER_RUN"><img src="assets/ui/icons/ability_power.svg" alt="Power"></button>
      <button class="ability-btn" data-ability="SPEED_RUN"><img src="assets/ui/icons/ability_speed.svg" alt="Speed"></button>
      <button class="ability-btn" data-ability="TRICKY_RUN"><img src="assets/ui/icons/ability_tricky.svg" alt="Trick"></button>
    </div>
  </div>

  <script src="./js/contract.js"></script>
  <script src="./js/config.js"></script>
  <script src="./js/clock.js"></script>
  <script src="./js/game-state.js"></script>
  <script src="./js/career-progression.js"></script>
  <script src="./js/story.js"></script>
  <script src="./js/asset-manifest.js"></script>
  <script src="./js/sprite-loader.js"></script>
  <script src="./js/ui-backdrops.js"></script>
  <script src="./js/logic-gates.js"></script>
  <script src="./js/trie.js"></script>
  <script src="./js/gear.js"></script>
  <script src="./js/unlockables.js"></script>
  <script src="./js/rewards.js"></script>
  <script src="./js/save.js"></script>
  <script src="./js/smart-play.js"></script>
  <script src="./js/overlay-ui.js"></script>
  <script src="./js/abilities.js"></script>
  <script src="./js/collision-resolution.js"></script>
  <script src="./js/spawner.js"></script>
  <script src="./js/physics.js"></script>
  <script src="./js/canvas-layer-manager.js"></script>
  <script src="./js/render-core.js"></script>
  <script src="./js/render-scene.js"></script>
  <script src="./js/render-defenders.js"></script>
  <script src="./js/render-player.js"></script>
  <script src="./js/master-contract.js"></script>
  <script>
    // --- Register this inline bootstrap block as a non-modular piece -------
    registerNonModular('index.html:inline-boot', {
      what: 'Wires canvas, HUD text, ability buttons, and swipe/tap input to the game core',
      where: 'index.html — bottom <script> block, runs after all module scripts'
    });
    registerNonModular('index.html:css-frame', {
      what: 'Outer decorative frame + fixed 80px bottom control border CSS',
      where: 'index.html — <style> block'
    });

    const canvas = document.getElementById('gameCanvas');
    const core = createRenderCore(canvas);
    core.stateManager.logPlay('Kickoff — welcome to the field.');
    core.start(); // async: loads real assets first, silhouettes fill any gaps

    runMasterAudit(); // full project audit: JS contracts + non-modular pieces + load order

    // --- HUD text + ability button visuals, ticked every frame -------------
    // (abilityController now lives inside render-core.js's loop — core.abilityController
    // is ticked there every fixed-step frame, this just reads its status for display)
    function updateHudText() {
      document.getElementById('clockDisplay').textContent = core.stateManager.clock.formatted();
      document.getElementById('stateDisplay').textContent = core.stateManager.current;
      document.getElementById('log').textContent = core.stateManager.playByPlayLog.slice(-3).join(' | ');

      document.querySelectorAll('.ability-btn').forEach(btn => {
        const id = btn.dataset.ability;
        const status = core.abilityController.getStatus(id);
        btn.classList.toggle('on-cooldown', !status.ready);
        let cdEl = btn.querySelector('.cd-num');
        if (!status.ready) {
          if (!cdEl) { cdEl = document.createElement('span'); cdEl.className = 'cd-num'; btn.appendChild(cdEl); }
          cdEl.textContent = Math.ceil(status.cooldownRemainingSec);
        } else if (cdEl) {
          cdEl.remove();
        }
      });

      requestAnimationFrame(updateHudText);
    }
    updateHudText();

    // --- Ability buttons: tap to activate ----------------------------------
    document.querySelectorAll('.ability-btn').forEach(btn => {
      btn.addEventListener('pointerdown', (e) => {
        e.stopPropagation(); // don't let this bleed into the swipe handler below
        const id = btn.dataset.ability;
        const activated = core.abilityController.activate(id);
        if (activated) {
          core.stateManager.logPlay(`${ABILITY_CATALOG[id].label} activated!`);
        }
      });
    });

    // --- Swipe left/right on the play area = move exactly one lane -----------
    // (unless the between-play overlay is up, in which case a tap selects a
    // Smart Play card instead — see core.handleOverlayTap())
    const playArea = document.getElementById('playArea');
    let swipeStartX = null, swipeStartY = null;
    const SWIPE_THRESHOLD_PX = 30;

    /** Converts a pointer event's client coords into canvas logical-pixel space. */
    function toCanvasCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = GAME_CONFIG.GAME_WIDTH / rect.width;
      const scaleY = GAME_CONFIG.GAME_HEIGHT / rect.height;
      return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };
    }

    playArea.addEventListener('pointerdown', (e) => {
      swipeStartX = e.clientX;
      swipeStartY = e.clientY;
    });
    playArea.addEventListener('pointerup', (e) => {
      if (swipeStartX === null) return;
      const dx = e.clientX - swipeStartX;
      swipeStartX = null; swipeStartY = null;

      // Overlay active (between plays / skill menu)? Route the tap there first.
      const { x, y } = toCanvasCoords(e);
      if (core.handleOverlayTap(x, y)) return;

      // Otherwise, normal lane-swipe during live play.
      if (Math.abs(dx) < SWIPE_THRESHOLD_PX) return; // treat as a tap, ignore
      const direction = dx > 0 ? 1 : -1;
      core.physicsWorld.requestLaneChange(direction);
    });
  </script>
</body>
</html>
